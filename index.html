<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Лабораторная работа 1</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #bbb;
        color: white;
        padding: 10px 20px;
      }

      header img {
        height: 50px;
      }

      header h1 {
        flex-grow: 1;
        text-align: center;
        margin: 0;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
      }

      footer {
        background: #eee;
        text-align: center;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="src/Logo_Polytech_rus_main.jpg" alt="Логотип" />
      <h1>Лабораторная работа</h1>
      <div style="width: 50px"></div>
    </header>

    <main>
      <div id="content">Загрузка...</div>
    </main>

    <footer>задание для самостоятельной работы</footer>

    <script>
      const content = document.getElementById("content");

      const now = new Date();
      content.innerHTML = `
        <p>Hello, World!</p>
        <p>Текущее время: ${now.toLocaleString()}</p>
    `;
    </script>
  </body>
</html>

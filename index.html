<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Feedback Form</title>
    <style>
      body {
        margin: 0;
        font-family: Arial;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header,
      footer {
        background: #bbb;
        color: white;
        padding: 10px;
      }
      header {
        display: flex;
        align-items: center;
      }
      header img {
        height: 50px;
      }
      header h1 {
        flex-grow: 1;
        text-align: center;
        margin: 0;
      }

      main {
        flex: 1;
        padding: 20px;
      }

      form {
        max-width: 500px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input,
      textarea,
      select {
        padding: 8px;
      }

      footer {
        text-align: center;
        background: #eee;
        color: black;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="src/Logo_Polytech_rus_main.jpg" />
      <h1>Feedback Form</h1>
    </header>

    <main>
      <form action="https://httpbin.org/post" method="POST">
        <input
          type="text"
          name="name"
          placeholder="Имя пользователя"
          required
        />

        <input
          type="email"
          name="email"
          placeholder="E-mail пользователя"
          required
        />

        <select name="type">
          <option value="complaint">Жалоба</option>
          <option value="suggestion">Предложение</option>
          <option value="thanks">Благодарность</option>
        </select>

        <textarea name="message" placeholder="Текст обращения"></textarea>

        <label> <input type="checkbox" name="reply" value="sms" /> SMS </label>
        <label>
          <input type="checkbox" name="reply" value="email" /> E-mail
        </label>

        <button type="submit">Отправить</button>
      </form>

      <br />
      <a href="headers.php">Перейти на 2 страницу</a>
    </main>

    <footer>задание для самостоятельной работы</footer>
  </body>
</html>
